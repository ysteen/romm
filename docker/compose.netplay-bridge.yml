services:
  netplay-bridge:
    build:
      context: ${NETPLAY_BRIDGE_SOURCE:-../../retroarch-netplay-bridge}
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NETPLAY_BRIDGE_ADMIN_TOKEN: ${NETPLAY_BRIDGE_TOKEN:?Set a shared token of at least 24 characters}
      NETPLAY_BRIDGE_ORIGINS: ${NETPLAY_BRIDGE_ORIGINS:-}
    ports:
      - "${NETPLAY_BRIDGE_HTTP_BIND:-127.0.0.1}:8082:8080"
      - "${NETPLAY_BRIDGE_TCP_BIND:-127.0.0.1}:55435-55442:55435-55442"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1
