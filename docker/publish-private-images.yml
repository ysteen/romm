name: Publish Private Custom Images

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-custom.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-custom-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ysteen/romm-image-builds' && github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: ghcr-verification
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ysteen/romm
          ref: custom/retroarch-dosbox-5.4.1
          persist-credentials: false

      - name: Verify package visibility before publication
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 backend/tools/check_private_ghcr.py "$OWNER" romm-custom-private --allow-missing
          python3 backend/tools/check_private_ghcr.py "$OWNER" romm-romforge-private --allow-missing

      - name: Test deployment and privacy guards
        run: |
          python3 -m unittest discover -s backend/tests -p test_deploy_script.py
          python3 -m unittest discover -s backend/tests -p test_private_ghcr.py

      - name: Resolve image names
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(sed -n 's/^ARG ROMM_BASE_IMAGE=.*:\([^:]*\)$/\1/p' docker/Dockerfile.custom-dosbox-pure)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "app=ghcr.io/${OWNER,,}/romm-custom-private" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${OWNER,,}/romm-romforge-private" >> "$GITHUB_OUTPUT"
          revision=$(git rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${revision:0:12}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish application by commit
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.custom-dosbox-pure
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.app }}:${{ steps.images.outputs.tag }}
          build-args: ROMM_CUSTOM_REVISION=${{ steps.images.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/ysteen/romm-image-builds
            org.opencontainers.image.title=Private custom RomM build
            org.opencontainers.image.description=Personal fork with custom EmulatorJS cores and directory save synchronization.
          cache-from: type=gha,scope=custom-romm-amd64
          cache-to: type=gha,mode=max,scope=custom-romm-amd64

      - name: Publish matching RomForge worker
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.romforge
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.worker }}:${{ steps.images.outputs.tag }}
          build-args: ROMM_WORKER_BASE_IMAGE=${{ steps.images.outputs.app }}@${{ steps.app.outputs.digest }}
          labels: |
            org.opencontainers.image.source=https://github.com/ysteen/romm-image-builds
            org.opencontainers.image.title=Private custom RomForge worker
            org.opencontainers.image.revision=${{ steps.images.outputs.revision }}
          cache-from: type=gha,scope=custom-romforge-amd64
          cache-to: type=gha,mode=max,scope=custom-romforge-amd64

      - name: Confirm both packages are private
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 backend/tools/check_private_ghcr.py "$OWNER" romm-custom-private
          python3 backend/tools/check_private_ghcr.py "$OWNER" romm-romforge-private

      - name: Pull and boot the published images
        env:
          APP_IMAGE: ${{ steps.images.outputs.app }}@${{ steps.app.outputs.digest }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}@${{ steps.worker.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "romm-deployment"
          root.mkdir()
          values = {
              "DB_ROOT_PASSWORD": secrets.token_hex(24),
              "DB_PASSWORD": secrets.token_hex(24),
              "ROMM_AUTH_SECRET_KEY": secrets.token_hex(32),
              "ROMM_PORT": "18081",
              "ROMM_DATA_DIR": str(root / "data"),
              "ROMM_IMAGE": os.environ["APP_IMAGE"],
              "ROMFORGE_IMAGE": os.environ["WORKER_IMAGE"],
              "ROMFORGE_ENABLED": "true",
              "ROMFORGE_MEMORY": "1g",
              "HASHEOUS_API_ENABLED": "false",
          }
          target = root / ".env"
          target.write_text("".join(f"{key}={value}\n" for key, value in values.items()))
          target.chmod(0o600)
          PY
          ./scripts/deploy-dosbox-pure.sh --env-file "$RUNNER_TEMP/romm-deployment/.env"
          sleep 5
          docker compose --env-file "$RUNNER_TEMP/romm-deployment/.env" \
            -f compose.dosbox-pure.yml -f compose.romforge.yml --profile romforge \
            exec -T romforge python -c 'from handler.patch_jobs import HEARTBEAT_KEY; from handler.redis_handler import redis_client; assert redis_client.exists(HEARTBEAT_KEY), "Worker heartbeat missing"; print("Worker heartbeat verified")'

      - name: Publish verified version tags
        env:
          APP_IMAGE: ${{ steps.images.outputs.app }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          VERSION: ${{ steps.images.outputs.version }}
        run: |
          docker buildx imagetools create --tag "$WORKER_IMAGE:$VERSION" "$WORKER_IMAGE@$WORKER_DIGEST"
          docker buildx imagetools create --tag "$APP_IMAGE:$VERSION" "$APP_IMAGE@$APP_DIGEST"
          printf 'Private application: `%s@%s`\n\nPrivate worker: `%s@%s`\n' \
            "$APP_IMAGE" "$APP_DIGEST" "$WORKER_IMAGE" "$WORKER_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Package the installation files
        run: bash scripts/package-deployment.sh "$RUNNER_TEMP/romm-deployment.tar.gz"

      - name: Upload installation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: romm-deployment-${{ steps.images.outputs.tag }}
          path: ${{ runner.temp }}/romm-deployment.tar.gz
          retention-days: 14

      - name: Remove verification containers
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/romm-deployment/.env" ]]; then
            docker compose --env-file "$RUNNER_TEMP/romm-deployment/.env" \
              -f compose.dosbox-pure.yml -f compose.romforge.yml --profile romforge \
              down --volumes --timeout 20
          fi
